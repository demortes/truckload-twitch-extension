# Option A — Ingress (requires an Ingress Controller like nginx-ingress or traefik)
# Replace truckload.example.com with your actual domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truckload-ingress
  namespace: truckload
  annotations:
    # For nginx-ingress:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # For cert-manager (auto TLS):
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Uncomment if using cert-manager:
  # tls:
  #   - hosts:
  #       - truckload.example.com
  #     secretName: truckload-tls
  rules:
    - host: truckload.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: truckload-backend
                port:
                  number: 80
