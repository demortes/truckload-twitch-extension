name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Truckload.Ebs/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/truckload-ebs:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/truckload-ebs:latest

  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file exe
        run: |
          dotnet publish bridge/Truckload.Bridge -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish/bridge
      - name: Zip release asset
        shell: bash
        run: |
          cp bridge/README.md publish/bridge/README.md
          cd publish/bridge
          7z a ../../Truckload.Bridge-win-x64-v${{ steps.version.outputs.version }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-release-asset
          path: Truckload.Bridge-win-x64-v*.zip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Build with the production backend URL
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
      - run: npm run zip
      - run: mv truckload-extension.zip ../truckload-extension-v${{ steps.version.outputs.version }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-release-asset
          path: truckload-extension-v*.zip

  release:
    needs: [backend-image, bridge, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/*.zip
