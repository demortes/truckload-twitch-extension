name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  backend-image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/truckload-ebs
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Truckload.Ebs/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/truckload-ebs:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/truckload-ebs:latest
      - name: Record release in Datadog (DORA deployment)
        if: ${{ env.DD_API_KEY != '' }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        run: >
          npx --yes @datadog/datadog-ci dora deployment
          --service truckload-ebs
          --env production
          --version ${{ steps.version.outputs.version }}
          --started-at ${{ steps.version.outputs.started_at }}
          --git-repository-url ${{ github.server_url }}/${{ github.repository }}
          --git-commit-sha ${{ github.sha }}

  bridge:
    name: Publish bridge exe (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file exe
        shell: bash
        run: |
          dotnet publish bridge/Truckload.Bridge -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/bridge
      - name: Zip release asset
        shell: bash
        run: |
          cp bridge/README.md publish/bridge/README.md
          cd publish/bridge
          7z a ../../Truckload.Bridge-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip .
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-release-asset-${{ matrix.rid }}
          path: Truckload.Bridge-${{ matrix.rid }}-v*.zip

  frontend:
    name: Build and zip frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        # This is a publish job, so caching is disabled to avoid a poisoned
        # cache reaching a released artifact. actions/setup-node@v4 only
        # accepts '' / 'npm' / 'yarn' / 'pnpm' for `cache` — `false` is
        # stringified to "false" and rejected ("Caching for 'false' is not
        # supported"). Omitting the input entirely is how caching is disabled.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Require production backend URL
        # Without this the frontend silently falls back to http://localhost:8080, which
        # cannot work from a viewer's/broadcaster's browser.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "::error::Set the BACKEND_URL repository variable to the backend's public HTTPS URL (Settings > Secrets and variables > Actions > Variables)."; exit 1 ;;
          esac
      - name: Build with the production backend URL
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
      - name: Zip extension assets
        run: npm run zip
      - name: Rename zip with version
        run: mv truckload-extension.zip ../truckload-extension-v${{ steps.version.outputs.version }}.zip
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-asset
          path: truckload-extension-v*.zip

  release:
    name: Publish GitHub release
    needs: [backend-image, bridge, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        # Restricted to our own release-asset artifacts. Without a pattern,
        # this also tries to pull docker/build-push-action's auto-uploaded
        # build-record artifact (name like `<owner>~<repo>~<hash>.dockerbuild`
        # from the backend-image job), which isn't a zip and reliably fails
        # to download/extract, failing this job even though every real asset
        # already downloaded successfully.
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-release-asset*'
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            artifacts/*.zip
