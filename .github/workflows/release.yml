name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bridge:
    name: Publish bridge exe (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single-file exe
        shell: bash
        run: |
          dotnet publish bridge/Truckload.Bridge -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish/bridge
      - name: Zip release asset
        shell: bash
        run: |
          cp bridge/README.md publish/bridge/README.md
          cd publish/bridge
          7z a ../../Truckload.Bridge-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.zip .
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v7
        with:
          name: bridge-release-asset-${{ matrix.rid }}
          path: Truckload.Bridge-${{ matrix.rid }}-v*.zip
      - name: Publish tray app (Windows only)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet publish bridge/Truckload.Bridge.Tray -c Release -r win-x64 --self-contained             -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true             -p:Version=${{ steps.version.outputs.version }}             -o publish/tray
          cd publish/tray
          7z a ../../Truckload.Bridge.Tray-win-x64-v${{ steps.version.outputs.version }}.zip Truckload.Bridge.Tray.exe
      - name: Upload tray app artifact
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: bridge-tray-release-asset
          path: Truckload.Bridge.Tray-win-x64-v*.zip

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-release-asset
          path: installer/output/TruckloadSetup-v*.exe

  frontend:
    name: Build and zip frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        # This is a publish job, so caching is disabled to avoid a poisoned
        # cache reaching a released artifact. actions/setup-node@v4 only
        # accepts '' / 'npm' / 'yarn' / 'pnpm' for `cache` — `false` is
        # stringified to "false" and rejected ("Caching for 'false' is not
        # supported"). Omitting the input entirely is how caching is disabled.
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Require production backend URL
        # Without this the frontend silently falls back to http://localhost:8787, which
        # cannot work from a viewer's/broadcaster's browser.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "::error::Set the BACKEND_URL repository variable to the Worker's public HTTPS URL (Settings > Secrets and variables > Actions > Variables)."; exit 1 ;;
          esac
      - name: Build with the production backend URL
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
      - name: Zip extension assets
        run: npm run zip
      - name: Rename zip with version
        run: mv truckload-extension.zip ../truckload-extension-v${{ steps.version.outputs.version }}.zip
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release-asset
          path: truckload-extension-v*.zip

  release:
    name: Publish GitHub release
    needs: [bridge, frontend, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        # Restricted to our own release-asset artifacts, so no other artifact uploaded during the
        # run (which may not be a zip) can fail the download.
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*-release-asset*'
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            artifacts/*.zip artifacts/*.exe
