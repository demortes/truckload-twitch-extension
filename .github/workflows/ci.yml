name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  dotnet:
    name: .NET (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Truckload.slnx
      - name: Build
        run: dotnet build Truckload.slnx -c Release --no-restore
      - name: Test
        run: >
          dotnet test Truckload.slnx -c Release --no-build
          --logger "junit;LogFilePath=${{ github.workspace }}/test-results/{assembly}.xml"
      - name: Keep JUnit results for the Datadog upload job
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke-test bridge publish (win-x64 single file)
        run: |
          dotnet publish bridge/Truckload.Bridge -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -o /tmp/bridge-publish-check

  datadog-test-upload:
    name: Upload test results to Datadog
    needs: [dotnet]
    if: ${{ always() && needs.dotnet.result != 'skipped' }}
    runs-on: ubuntu-latest
    # This job holds the API key, so it deliberately checks out and runs nothing from the repository (no
    # build, no tests): it only uploads the JUnit files produced by the job above. Fork PRs get no secrets,
    # so the upload step is skipped for them.
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
      # No checkout here, so tell datadog-ci which commit these results belong to.
      DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Download JUnit results
        uses: actions/download-artifact@v8
        with:
          name: junit-test-results
          path: test-results
      - name: Upload test results to Datadog
        if: ${{ env.DD_API_KEY != '' }}
        run: >
          npx --yes @datadog/datadog-ci@5.24.1 junit upload
          --service truckload-twitch-extension
          --env ci
          --tags team:truckload
          test-results

  docker:
    name: Docker (backend image build check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker metadata (OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/truckload-ebs
      - name: Build backend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Truckload.Ebs/Dockerfile
          push: false
          build-args: |
            VERSION=0.0.0-ci
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          labels: ${{ steps.meta.outputs.labels }}

  installer:
    name: Windows installer (build check)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.0.0-ci
      - name: Upload installer for testing
        uses: actions/upload-artifact@v7
        with:
          name: TruckloadSetup-ci
          path: installer/output/TruckloadSetup-*.exe
          retention-days: 7
