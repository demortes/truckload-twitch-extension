---
# TruckTel app configuration for the Truckload Bridge.
# https://github.com/demortes/truckload-twitch-extension

# Port TruckTel's web server listens on for this app. The Truckload Bridge reads
# telemetry from here (it also tries TruckTel's default 8080 as a fallback). If you
# change this, run the Bridge with --telemetry-url http://localhost:<port>
port: 25852

# Metadata for the landing page.
title: Truckload Bridge
subtitle: Live ATS/ETS2 job stats on your Twitch stream.
text: |
  Truckload is a Twitch extension that shows your current job and truck stats to
  your viewers. The Truckload Bridge (a small app on this PC) reads telemetry from
  TruckTel and sends it to the extension's backend. Start the Bridge from the Start
  menu or desktop shortcut; there is nothing to open in the browser.
link: "https://github.com/demortes/truckload-twitch-extension"

# The Bridge is a native app, so there is no web UI to launch from the landing page.
disable-launcher: true

# Which content types the static server should use ('if' is a regex matched against the
# filename; if it matches, the content type in 'then' is sent).
content-types:
  - if: .*\.html?
    then: text/html; charset=utf-8
  - if: .*\.json
    then: application/json; charset=utf-8
  - if: .*\.js
    then: text/javascript; charset=utf-8
  - if: .*\.css
    then: text/css; charset=utf-8
  - if: .*\.svg
    then: image/svg+xml; charset=utf-8
  - if: .*\.png
    then: image/png
  - if: .*\.jpe?g
    then: image/jpeg
  - if: .*\.gif
    then: image/gif
  - if: .*\.ico
    then: image/vnd.microsoft.icon
