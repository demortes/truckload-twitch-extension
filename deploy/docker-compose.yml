version: '3.8'

# Production deployment for a single VM: Caddy terminates TLS (via Let's Encrypt,
# automatically, from just a domain name) and reverse-proxies to the backend.
# See deploy/DEPLOY.md for setup steps.

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      com.datadoghq.tags.service: truckload-caddy
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.tags.version: "2"
      com.datadoghq.ad.logs: '[{"source":"caddy","service":"truckload-caddy"}]'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER}/truckload-ebs:${TAG:-latest}
    expose:
      - "8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=truckload;Username=${POSTGRES_USER:-truckload};Password=${POSTGRES_PASSWORD}
      - Twitch__ClientId=${TWITCH_EXTENSION_CLIENT_ID}
      - Twitch__ExtensionSecret=${TWITCH_EXTENSION_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=true
      - DD_ENV=${DD_ENV:-production}
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.datadoghq.tags.env: ${DD_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truckload
      POSTGRES_USER: ${POSTGRES_USER:-truckload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      com.datadoghq.tags.service: truckload-db
      com.datadoghq.tags.env: ${DD_ENV:-production}
      com.datadoghq.tags.version: "16"
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"truckload-db"}]'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truckload} -d truckload"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
