version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Truckload.Ebs/Dockerfile
    ports:
      - "${BACKEND_PORT:-25846}:25846"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=truckload;Username=${POSTGRES_USER:-truckload};Password=${POSTGRES_PASSWORD:-truckload}
      - Twitch__ClientId=${TWITCH_EXTENSION_CLIENT_ID}
      - Twitch__ExtensionSecret=${TWITCH_EXTENSION_SECRET}
      - ASPNETCORE_ENVIRONMENT=Production
      - DD_ENV=${DD_ENV:-local}
      - DD_AGENT_HOST=host.docker.internal
      - DD_TRACE_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.datadoghq.tags.env: ${DD_ENV:-local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truckload
      POSTGRES_USER: ${POSTGRES_USER:-truckload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truckload}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25847}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truckload} -d truckload"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
